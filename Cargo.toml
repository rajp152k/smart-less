[package]
name = "smart-less"
version = "0.1.0"
edition = "2024"
description = "A safe, read-only terminal reader for structured documents"
license = "MIT"
repository = "https://github.com/rajp152k/smart-less"
homepage = "https://github.com/rajp152k/smart-less"
readme = "README.md"
keywords = ["terminal", "pager", "markdown", "json", "yaml"]
categories = ["command-line-utilities", "text-processing"]
rust-version = "1.85"

[[bin]]
name = "sl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.4.0"
minus = { version = "5.7.2", default-features = false, features = [
  "static_output",
  "search",
] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
toml = "1.1.4"
unicode-width = "0.2.2"

[patch.crates-io]
# minus 5.7.2 panics after confirming a search with no matches.
minus = { path = "vendor/minus" }

[dev-dependencies]
insta = { version = "1.48.0", features = ["yaml"] }
